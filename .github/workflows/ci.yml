name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  # Phase one is the fixed input. If the fixture drifts or the shared packages
  # stop typechecking, no build result from this commit means anything, so
  # nothing else runs until this passes.
  shared:
    name: shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The site's chat function, api/chat.ts, with a fake model. No provider
      # is called and no key is needed.
      - name: chat function unit tests
        run: pnpm test:api
      # Report only. The builds were scored as written, and reformatting them
      # would move the line counts the comparison publishes, so findings show
      # in the log without failing the run. See handoff.md section 6.
      - name: biome lint and format, report only
        continue-on-error: true
        run: |
          status=0
          pnpm lint || status=1
          pnpm format:check || status=1
          exit $status
      - name: fixture assumptions still hold
        run: pnpm fixture:check
      - name: tickets.json matches the seed
        run: |
          pnpm fixture:generate
          git diff --exit-code packages/fixture/tickets.json

  # One job per app. A library failing its criteria is a recorded result, so the
  # matrix uses fail-fast: false and every build reports.
  builds:
    name: ${{ matrix.app }}
    needs: shared
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - react-shadcn
          - react-mui
          - react-chakra
          - react-antd
          - react-headless
          - vue-vuetify
          - vue-primevue
          - vue-quasar
    steps:
      # fetch-depth: 0 pulls full history rather than actions/checkout's
      # default single commit, so origin/main exists locally for the diff
      # step below. On a push to main that step diffs main against itself
      # (a trivial pass), so this only matters on a pull request, and no PR
      # had run before this one, which is why the shallow checkout's
      # `fatal: bad revision 'origin/main'` went unnoticed until now.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: skip until this build is scaffolded
        id: exists
        run: echo "found=$([ -d builds/${{ matrix.app }} ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.found == 'yes'
        run: pnpm install --frozen-lockfile
      - name: shared suite, 18 criteria
        if: steps.exists.outputs.found == 'yes'
        run: pnpm --filter @uilc/${{ matrix.app }} test
      - name: nobody edited the shared packages
        if: steps.exists.outputs.found == 'yes'
        run: git diff --exit-code origin/main -- packages/criteria packages/harness
      - if: steps.exists.outputs.found == 'yes'
        run: pnpm --filter @uilc/${{ matrix.app }} build
      - name: the baseline the delta subtracts
        if: steps.exists.outputs.found == 'yes'
        run: pnpm --filter @uilc/baseline-${{ startsWith(matrix.app, 'react-') && 'react' || 'vue' }} build
      # Lighthouse serves dist and drives headless Chrome, which the runner
      # already has. It writes builds/<app>/lighthouse.json, and measure below
      # reads the median off it, so this step has to come first.
      - name: first contentful paint, median of five runs
        if: steps.exists.outputs.found == 'yes'
        run: pnpm lighthouse --build ${{ matrix.app }}
      - name: size, delta, and the budget
        if: steps.exists.outputs.found == 'yes'
        run: pnpm --filter @uilc/${{ matrix.app }} measure
      - uses: actions/upload-artifact@v4
        if: steps.exists.outputs.found == 'yes'
        with:
          name: result-${{ matrix.app }}
          path: results/${{ matrix.app }}.json

  # The baselines feed the delta and are never published.
  baselines:
    needs: shared
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [baseline-react, baseline-vue]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uilc/${{ matrix.app }} build

  # The results site, spec/site-spec.md. It builds only from a run where every
  # criteria suite passed. Vercel builds and deploys main itself on every push
  # (handoff.md section 16), so this job only builds the site, checks it, and
  # uploads site/dist as an artifact.
  publish:
    needs: [builds, baselines]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the site, from results/ and the two markdown files
        run: pnpm site:build
      - name: the eight live screens under /screens/<build>/
        run: pnpm site:screens
      # Serves site/dist and drives the runner's Chrome. axe-core runs on every
      # route, the scoreboard, a build detail view, and the write-up included,
      # and fails on any serious or critical violation. The same script checks
      # the fold, keyboard focus, and that each screen's assets resolve.
      - name: axe-core and the site checks
        run: pnpm site:check
      - name: the publish left no tracked file changed
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
